name: Build documentation preview

on:
  pull_request:
  push:
    branches: [main]
    # A release tag freezes its manual as a GitHub release archive; see the release job.
    tags: ["OPALX-*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  QUARTO_PROFILE: opalx
  # Temporarily paused; restore book.downloads in _quarto.yml when re-enabling.
  BUILD_PDF: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out manual
        uses: actions/checkout@v4
        with:
          # The front-page change list is generated from the checked-out history.
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Test latest-changes generator
        run: ruby tests/test_latest_changes.rb

      - name: Test release-site assembly
        run: ruby tests/test_assemble_release_sites.rb

      - name: Validate manual source
        run: ruby scripts/validate_manual.rb

      - name: Check out documents
        uses: actions/checkout@v4
        with:
          repository: OPALX-project/opalx-documents
          lfs: true
          path: _external/opalx-documents

      - name: Validate document links
        env:
          DOCUMENTS_CHECKOUT: _external/opalx-documents
        run: ruby scripts/validate_manual.rb

      - name: Render HTML
        run: quarto render --profile "${QUARTO_PROFILE}" --to html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install browser-test dependencies
        run: npm ci

      - name: Test interactive documentation controls
        run: npm run test:browser

      - name: Render unnumbered report archive
        run: quarto render resources/reports --profile "${QUARTO_PROFILE}" --to html

      - name: Install TinyTeX
        if: env.BUILD_PDF == 'true'
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install headless Chrome for PDF diagrams
        if: env.BUILD_PDF == 'true'
        run: quarto install chrome-headless-shell --no-prompt

      - name: Install PDF conversion and inspection tools
        if: env.BUILD_PDF == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin poppler-utils
          rsvg-convert --version

      - name: Render A4 PDF
        if: env.BUILD_PDF == 'true'
        run: quarto render --profile "${QUARTO_PROFILE}" --to pdf --no-clean

      - name: Validate rendered links and profile URLs
        run: ruby scripts/validate_rendered_html.rb

      - name: Validate rendered PDF hierarchy
        if: env.BUILD_PDF == 'true'
        run: ruby scripts/validate_rendered_pdf.rb

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opalx-documentation-${{ env.QUARTO_PROFILE }}
          path: _site
          if-no-files-found: error

      - name: Package release manual
        if: startsWith(github.ref, 'refs/tags/OPALX-')
        run: tar -czf opalx-manual-site.tar.gz -C _site .

      - name: Upload release manual
        if: startsWith(github.ref, 'refs/tags/OPALX-')
        uses: actions/upload-artifact@v4
        with:
          name: opalx-manual-release
          path: opalx-manual-site.tar.gz
          if-no-files-found: error

      # Released manuals are never rebuilt: their archives are unpacked beside
      # the development build on every deployment.
      - name: Add released manuals
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName' |
          while read -r tag; do
            case "$tag" in OPALX-*) ;; *) continue ;; esac
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern opalx-manual-site.tar.gz --dir "_releases/$tag" ||
              echo "::warning::Release $tag has no opalx-manual-site.tar.gz"
          done
          ruby scripts/assemble_release_sites.rb _site _releases

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  release:
    if: startsWith(github.ref, 'refs/tags/OPALX-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download release manual
        uses: actions/download-artifact@v4
        with:
          name: opalx-manual-release

      - name: Attach manual to the GitHub release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" opalx-manual-site.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" opalx-manual-site.tar.gz --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Manual for $TAG" \
              --notes "Rendered HTML manual for $TAG, published under its release series."
          fi

      # Releases created with GITHUB_TOKEN do not trigger workflows, but a
      # dispatch does: rebuild the development site, which adds this archive.
      - name: Redeploy the published site
        run: |
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}"

  deploy:
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
