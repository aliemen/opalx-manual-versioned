project:
  type: book
  output-dir: _site
  pre-render:
    - ruby scripts/generate_latest_changes.rb
    - ruby scripts/validate_manual.rb

filters:
  - filters/latest-changes.lua
  - filters/version-block-labels.lua

book:
  title: "The OPALX Universe"
  subtitle: "User guide, physics manual, reference, and developer handbook"
  sidebar:
    collapse-level: 1
  repo-branch: main
  repo-actions: [edit, issue]
  # PDF publication is temporarily paused with BUILD_PDF in the build workflow.
  downloads: []
  search: true
  page-footer:
    left: "OPALX is developed by an international accelerator-science community."
    right: "Documentation status is shown on every page."
  chapters:
    - index.qmd
    - part: "Getting Started"
      chapters:
        - getting-started/index.qmd
        - getting-started/clusters/index.qmd
        - getting-started/first-simulation.qmd
        - getting-started/worked-inputs.qmd
    - part: "User Guide"
      chapters:
        - user-guide/introduction/index.qmd
        - user-guide/conventions/index.qmd
        - user-guide/input-language.qmd
        - user-guide/command-format/index.qmd
        - user-guide/control-statements/index.qmd
        - user-guide/options.qmd
        - user-guide/elements.qmd
        - user-guide/cyclotron.qmd
        - user-guide/diagnostics-output.qmd
        - user-guide/beam-lines/index.qmd
        - user-guide/beam.qmd
        - user-guide/beam-distributions.qmd
        - user-guide/field-solver/index.qmd
        - user-guide/tracking.qmd
        - user-guide/wakefields/index.qmd
        - user-guide/geometry/index.qmd
        - user-guide/particle-matter/index.qmd
        - user-guide/optimization/index.qmd
        - user-guide/sampler/index.qmd
    - part: "User Guide Appendix"
      chapters:
        - user-guide/appendix/field-maps/index.qmd
        - user-guide/appendix/language-syntax/index.qmd
        - user-guide/appendix/autophase/index.qmd
    - part: "Physics"
      chapters:
        - physics/overview/index.qmd
        - physics/coordinate-systems/index.qmd
        - physics/elements/index.qmd
        - physics/cyclotron.qmd
        - physics/linear-transfer-maps.qmd
        - physics/map-3-fringe-dba.qmd
        - physics/collective-effects.qmd
        - physics/field-solver/index.qmd
        - physics/beam-beam/index.qmd
        - physics/decay-processes/index.qmd
        - physics/spin-tracking/index.qmd
        - physics/gamma-gamma/index.qmd
        - physics/sandbox/index.qmd
    - part: "Reference"
      chapters:
        - reference/commands.qmd
        - reference/elements.qmd
        - reference/file-formats.qmd
        - reference/configuration.qmd
        - reference/api.qmd
    - part: "Developer Guide"
      chapters:
        - developer-guide/architecture.qmd
        - developer-guide/space-charge-solver-architecture.qmd
        - developer-guide/build-test-ci.qmd
        - developer-guide/adding-features.qmd
        - developer-guide/documentation-workflow.qmd
    - part: "Troubleshooting"
      chapters:
        - troubleshooting/common-problems.qmd
        - troubleshooting/bug-reports.qmd
        - troubleshooting/known-limitations.qmd
    - part: "Resources"
      chapters:
        - resources/publications.qmd
        - resources/presentations-reports.qmd
        - resources/regression-tests.qmd

number-sections: true
number-depth: 3
bibliography: references.bib
csl: csl/ieee.csl

format:
  html:
    theme:
      light:
        - cosmo
        - assets/styles/opalx-light.scss
        - assets/styles/opalx.scss
      dark:
        - darkly
        - assets/styles/opalx-dark.scss
        - assets/styles/opalx.scss
    toc: true
    code-copy: true
    code-overflow: wrap
    html-math-method: mathjax
    link-external-newwindow: true
    include-in-header:
      - includes/version-selector-init.html
    include-after-body:
      - assets/scripts/sidebar-page-toc.html
      - assets/scripts/persist-sidebar-state.html
      - assets/scripts/version-selector.html
      - assets/scripts/release-selector.html
  pdf:
    documentclass: scrreprt
    papersize: a4
    toc: true
    colorlinks: true
    include-in-header:
      - includes/tikz-preamble.tex

documents-base-url: "https://github.com/OPALX-project/opalx-documents/blob/main"
manual-repository-url: "https://github.com/OPALX-project/opalx-manual"
source-code-url: "https://github.com/OPALX-project/OPALX"
regression-tests-url: "https://amas.pages.psi.ch/opalx-regression/results"
regression-tests-source-url: "https://github.com/OPALX-project/regression-tests-x/blob/master"
doxygen-url: "https://amas.pages.psi.ch/opal-live-doc/opalx-doxygen/index.html"
legacy-opal-manual-url: "https://opalx-project.github.io/opal-manual"
deployment-profile: "opalx"
